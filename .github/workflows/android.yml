name: android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages & accept licenses
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee -a build.log

      - name: Publish build diagnostics on failure
        if: failure()
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          tok = os.environ.get("GITHUB_TOKEN","")
          log = open("build.log", encoding="utf-8", errors="replace").read()[-30000:]
          body = "## Android build failed\n\n```\n" + log + "\n```"
          data = json.dumps({"title":"Android build diagnostics (auto)","body":body}).encode("utf-8")
          req = urllib.request.Request(
            "https://api.github.com/repos/Dogstar776/proactive-ai-assistant/issues",
            data=data, method="POST",
            headers={"Authorization":"Bearer "+tok,"Content-Type":"application/json","Accept":"application/vnd.github+json"})
          try:
            with urllib.request.urlopen(req) as r:
              print("created issue:", r.read().decode()[:200])
          except urllib.error.HTTPError as e:
            print("ERR", e.code, e.read().decode()[:300])
          PY

      - name: Upload APK as GitHub Release (permanent download link)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag: v0.6.0-apk
          name: 星空调伴 APK（调试版）
          prerelease: true
          overwrite: true
          files: android/app/build/outputs/apk/debug/*.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android/build.log
          if-no-files-found: warn
