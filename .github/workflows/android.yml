name: android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (capture log)
        continue-on-error: true
        run: gradle testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Build Debug APK (capture log)
        continue-on-error: true
        run: gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee -a build.log

      - name: Publish build diagnostics
        if: always()
        run: |
          tail -n 4000 build.log > /tmp/diag.txt
          gh issue create --repo Dogstar776/proactive-ai-assistant \
            --title "Android build diagnostics (auto)" \
            --body-file /tmp/diag.txt || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proactive-assistant-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
