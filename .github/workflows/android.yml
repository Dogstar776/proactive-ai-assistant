name: android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (capture log)
        continue-on-error: true
        run: gradle testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Build Debug APK (capture log)
        continue-on-error: true
        run: gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee -a build.log

      - name: Publish build diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          tok = os.environ.get("GITHUB_TOKEN","")
          log = open("build.log", encoding="utf-8", errors="replace").read()[-30000:]
          data = json.dumps({"title":"Android build diagnostics (auto)","body":log}).encode("utf-8")
          req = urllib.request.Request(
            "https://api.github.com/repos/Dogstar776/proactive-ai-assistant/issues",
            data=data, method="POST",
            headers={"Authorization":"Bearer "+tok,"Content-Type":"application/json","Accept":"application/vnd.github+json"})
          try:
            with urllib.request.urlopen(req) as r:
              print("created issue:", r.read().decode()[:200])
          except urllib.error.HTTPError as e:
            print("ERR", e.code, e.read().decode()[:300])
          PY

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proactive-assistant-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
