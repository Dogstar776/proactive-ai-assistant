name: android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages (use pre-installed SDK)
        continue-on-error: true
        run: |
          # ubuntu-latest 已预装 Android SDK，直接用它；两个环境变量必须指向同一路径，否则 AGP 报错
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "Using SDK at: $SDK_DIR"
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV
          SDK_CMD="$(command -v sdkmanager || echo "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager")"
          echo "sdkmanager: $SDK_CMD"
          yes | "$SDK_CMD" --licenses >/dev/null 2>&1 || true
          "$SDK_CMD" "platforms;android-35" "build-tools;35.0.0" "platform-tools" 2>&1 | tee sdk.log
          echo "--- installed packages ---"
          "$SDK_CMD" --list_installed 2>&1 | tail -15 | tee -a sdk.log

      - name: Setup Gradle
        continue-on-error: true
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify toolchain
        continue-on-error: true
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"
          command -v gradle && gradle --version 2>&1 | tee -a build.log || echo "GRADLE_NOT_ON_PATH" | tee -a build.log

      - name: Unit tests
        continue-on-error: true
        run: gradle testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Build Debug APK
        continue-on-error: true
        run: gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee -a build.log

      - name: Diagnose & decide
        id: diag
        if: always()
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error, traceback
          ok = False
          text = ""
          try:
              logs = []
              for f in ("sdk.log", "build.log"):
                  if os.path.exists(f):
                      logs.append(open(f, encoding="utf-8", errors="replace").read())
              text = "\n".join(logs)
              apk_dir = "app/build/outputs/apk/debug"
              has_apk = os.path.isdir(apk_dir) and any(fn.endswith(".apk") for fn in os.listdir(apk_dir))
              if "BUILD FAILED" in text or "What went wrong" in text or "FAILED" in text:
                  has_apk = False
              ok = has_apk
              if not ok:
                  tok = os.environ.get("GITHUB_TOKEN", "")
                  body = "## Android build failed\n\n```\n" + text[-30000:] + "\n```"
                  req = urllib.request.Request(
                      "https://api.github.com/repos/Dogstar776/proactive-ai-assistant/issues",
                      data=json.dumps({"title": "Android build diagnostics (auto)", "body": body}).encode(),
                      method="POST",
                      headers={"Authorization": "Bearer " + tok, "Content-Type": "application/json", "Accept": "application/vnd.github+json"})
                  try:
                      urllib.request.urlopen(req).read()
                  except Exception as e:
                      print("issue post failed:", e)
          except Exception:
              print("diag error:", traceback.format_exc())
              tok = os.environ.get("GITHUB_TOKEN", "")
              body = "## Android build failed (diag error)\n\n" + traceback.format_exc()[-5000:]
              req = urllib.request.Request(
                  "https://api.github.com/repos/Dogstar776/proactive-ai-assistant/issues",
                  data=json.dumps({"title": "Android build diagnostics (auto)", "body": body}).encode(),
                  method="POST",
                  headers={"Authorization": "Bearer " + tok, "Content-Type": "application/json", "Accept": "application/vnd.github+json"})
              try:
                  urllib.request.urlopen(req).read()
              except Exception as e2:
                  print("issue post failed2:", e2)
          finally:
              with open(os.environ["GITHUB_OUTPUT"], "a") as o:
                  o.write("build_ok=%s\n" % ("true" if ok else "false"))
          PY

      - name: Upload APK artifact (always, guaranteed download)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proactive-assistant-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Publish APK as GitHub Release (direct API, permanent link)
        if: steps.diag.outputs.build_ok == 'true'
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error, urllib.parse
          REPO = "https://api.github.com/repos/Dogstar776/proactive-ai-assistant"
          UP = "https://uploads.github.com/repos/Dogstar776/proactive-ai-assistant"
          TAG = "v0.6.0-apk"
          tok = os.environ.get("GITHUB_TOKEN", "")
          def H(extra=None):
              h = {"Authorization": "Bearer " + tok, "Accept": "application/vnd.github+json"}
              if extra: h.update(extra)
              return h
          apk_dir = "app/build/outputs/apk/debug"
          apks = [f for f in os.listdir(apk_dir) if f.endswith(".apk")] if os.path.isdir(apk_dir) else []
          if not apks:
              print("no apk found in", apk_dir); raise SystemExit(0)
          path = os.path.join(apk_dir, apks[0]); name = apks[0]
          print("publishing", path, os.path.getsize(path), "bytes")
          # 同 tag 旧 release 先删，保证可重复发布
          try:
              r = urllib.request.urlopen(urllib.request.Request(REPO + "/releases/tags/" + TAG, headers=H()))
              old = json.loads(r.read().decode())
              urllib.request.urlopen(urllib.request.Request(
                  REPO + "/releases/%d" % old["id"], method="DELETE", headers=H())).read()
              print("deleted old release", old["id"])
          except Exception as e:
              print("no old release:", e)
          body = json.dumps({"tag_name": TAG, "name": "星空调伴 APK（调试版）",
                             "prerelease": True, "body": "由 CI 自动构建发布，供手机直接下载安装。"}).encode()
          try:
              r = urllib.request.urlopen(urllib.request.Request(
                  REPO + "/releases", data=body, method="POST", headers=H({"Content-Type": "application/json"})))
              rel = json.loads(r.read().decode())
          except urllib.error.HTTPError as e:
              print("create release err", e.code, e.read().decode()[:300]); raise SystemExit(0)
          up = rel["upload_url"].split("{")[0] + "?name=" + urllib.parse.quote(name)
          data = open(path, "rb").read()
          try:
              r = urllib.request.urlopen(urllib.request.Request(
                  up, data=data, method="POST",
                  headers=H({"Content-Type": "application/octet-stream"})))
              print("asset uploaded:", r.status)
          except urllib.error.HTTPError as e:
              print("upload asset err", e.code, e.read().decode()[:300])
          PY

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android/build.log
          if-no-files-found: warn
