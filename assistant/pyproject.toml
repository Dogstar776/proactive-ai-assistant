[project]
name = "proactive-ai-assistant"
version = "0.2.0"
description = "主动式AI助理：FL-PCL 五层持续认知闭环的受限常驻实例 + 实证仪器"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "feedparser>=6.0",
    "icalendar>=6.0",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
vector = ["chromadb>=1.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008：Depends(...) 是 FastAPI 依赖注入的标准写法，属误报
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
